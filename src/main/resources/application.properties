spring.application.name=labspringmvc

# PostgreSQL - valores padrão servem para o docker compose local.
# No Render, defina DB_URL, DB_USER e DB_PASSWORD como variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/labspringmvc}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
